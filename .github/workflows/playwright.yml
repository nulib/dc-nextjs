name: Playwright Tests
on:
  push:
    branches: []
  pull_request:
    branches: [main, deploy/staging]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container:
      # Image version must match @playwright/test in package.json.
      # Mismatch produces: "Executable doesn't exist at /ms-playwright/chromium-XXXX/..."
      # To upgrade: bump both this tag and the package.json version together.
      image: mcr.microsoft.com/playwright:v1.46.1-noble
      options: --user 1001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Install dependencies
        run: npm ci --force

      - name: Build app
        run: npm run build
        env:
          NEXT_PUBLIC_DCAPI_ENDPOINT: ${{ secrets.NEXT_PUBLIC_DCAPI_ENDPOINT }}

      - name: Start app
        run: npm run start:playwright &

      - name: Wait for server
        run: npx wait-on http://localhost:3000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: ${{ secrets.BASE_URL }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
